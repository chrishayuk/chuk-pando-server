[package]
name = "pando"
version = "0.1.0"
repository = "https://github.com/chrishayuk/chuk-pando-server"
license = "Apache-2.0"
homepage = "https://github.com/chrishayuk/chuk-pando-server"
description = "A Git-compatible server reproducing the Pando architecture OpenAI published in \"Scaling Git at OpenAI\" (independent; experimental)"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
crc32fast = "1.5.4"
flate2 = "1.1.10"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
webpki-roots = "1"

# Windows only (docs/WINDOWS.md): process liveness, termination and CPU time. Already in the lock file through tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.dist]
inherits = "release"
lto = "thin"
